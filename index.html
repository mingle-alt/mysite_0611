<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI 챗봇, 이미지/음악 생성, 앱 제작, 마케팅, 자동화, 리서치 서비스를 한곳에서 찾는 링크 허브"
    />
    <meta property="og:title" content="AI 서비스 링크 허브" />
    <meta property="og:description" content="AI 서비스를 검색과 카테고리로 빠르게 찾아보세요." />
    <title>AI 서비스 링크 허브</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">AI</span>
        <div>
          <h1>AI 서비스 링크 허브</h1>
          <p>업무에 맞는 AI 도구를 검색하고 바로 열어보세요.</p>
        </div>
      </div>
      <label class="search">
        <span>서비스 검색</span>
        <input id="searchInput" type="search" placeholder="Claude, 마케팅, 자동화, SEO..." />
      </label>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section class="sidebar-section">
          <div class="sidebar-title">카테고리</div>
          <nav id="categoryMenu" class="category-menu" aria-label="카테고리"></nav>
        </section>
      </aside>

      <section class="content">
        <div class="section-head">
          <div>
            <p class="eyebrow" id="activeMeta">전체</p>
            <h2 id="activeTitle">AI 서비스</h2>
          </div>
          <div class="count" id="resultCount">0개</div>
        </div>

        <div class="filterbar" aria-label="상세 필터">
          <label><input type="checkbox" id="freeFilter" /> 무료 시작</label>
          <label><input type="checkbox" id="koreanFilter" /> 한국어</label>
          <label><input type="checkbox" id="apiFilter" /> API</label>
          <select id="difficultyFilter" aria-label="난이도">
            <option value="all">난이도 전체</option>
            <option value="easy">쉬움</option>
            <option value="medium">보통</option>
            <option value="advanced">전문가용</option>
          </select>
          <button class="reset" id="resetFilters" type="button">초기화</button>
        </div>

        <div class="cards" id="cards"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
